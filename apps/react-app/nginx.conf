# Static server for the React production build. The front proxy forwards
# /react/ here with the prefix intact, and the Vite build references its assets
# under /react/, so the files live under that path too. SPA fallback keeps
# client-side routes working.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location /react/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /react/ {
        try_files $uri $uri/ /react/index.html;
    }

    # Health probe / anything else.
    location / {
        return 302 /react/;
    }
}
