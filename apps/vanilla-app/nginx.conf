# Static server for the vanilla production build. The front proxy forwards
# /vanilla/ here with the prefix intact, and the Vite build references its
# assets under /vanilla/, so the files live under that path too.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location /vanilla/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /vanilla/ {
        try_files $uri $uri/ /vanilla/index.html;
    }

    location / {
        return 302 /vanilla/;
    }
}
