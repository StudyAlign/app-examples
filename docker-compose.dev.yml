# ─────────────────────────────────────────────────────────────────────────
#  Dev overlay: hot-reloading Vite dev servers with the source bind-mounted.
#
#      COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml   (in .env)
#      docker compose up --build
#      open http://localhost:8080/
#
#  Each app runs `vite` on container port 80, so the proxy config is identical
#  in dev and prod. Vite's HMR client is told to reach the proxy port so live
#  reload works through the reverse proxy.
# ─────────────────────────────────────────────────────────────────────────

services:
  react-app:
    build:
      target: dev
    command: npm run dev
    environment:
      VITE_HMR_CLIENT_PORT: ${PROXY_PORT:-8080}
    volumes:
      - ./apps/react-app:/app
      - /app/node_modules

  vanilla-app:
    build:
      target: dev
    command: npm run dev
    environment:
      VITE_HMR_CLIENT_PORT: ${PROXY_PORT:-8080}
    volumes:
      - ./apps/vanilla-app:/app
      - /app/node_modules
