# ─────────────────────────────────────────────────────────────────────────
#  Production overlay.
#
#  Joins Caddy's shared external "web" network so the host reverse proxy reaches
#  the app by container name instead of a published port. Only the public
#  container (proxy) joins "web"; the two app containers stay on the private
#  default network.
#
#  On the server, set in .env:
#      COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#
#  Then Caddy (see deploy/Caddyfile.example) reaches this stack as:
#      reverse_proxy study_align_app_examples_proxy:80
# ─────────────────────────────────────────────────────────────────────────

services:
  proxy:
    ports: !reset []        # clear the host port the base file published
    networks:
      default: {}           # keep reaching the app containers
      web:                  # let the host Caddy reach it over the shared network
        # Stable, stack-specific name Caddy targets. Avoids colliding with the
        # generic "proxy" service name of other stacks sharing the "web" network.
        aliases:
          - study_align_app_examples_proxy

networks:
  web:
    external: true          # created by whoever runs Caddy: docker network create web
