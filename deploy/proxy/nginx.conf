# Front reverse proxy for the StudyAlign example apps. This is the single
# public-facing container. It serves the landing page and proxies the two demo
# apps by path prefix (the prefix is preserved so each app can live under its
# own base path and their hashed assets never collide).
#
# This file is included inside nginx's http{} block, so the `map` below is legal
# here, which powers WebSocket upgrades for Vite's HMR in dev (a harmless no-op in
# prod).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Landing page.
    location = / {
        try_files /index.html =404;
    }

    # React demo, Vite base "/react/". Prefix kept (no trailing slash on
    # proxy_pass), so react-app serves and routes under /react/.
    location /react/ {
        proxy_pass http://react-app:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vanilla demo, Vite base "/vanilla/".
    location /vanilla/ {
        proxy_pass http://vanilla-app:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
